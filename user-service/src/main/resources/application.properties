# =============================================
# Server
# =============================================
server.port=8082

# =============================================
# Application
# =============================================
spring.application.name=user-service

# =============================================
# Eureka
# =============================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# =============================================
# PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT (must match auth-service secret exactly)
# =============================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# =============================================
# Auth-service URL
# Calls go through the gateway, not directly to auth-service.
# Gateway (8080) → auth-service (8083)
# =============================================
auth.service.url=http://api-gateway:8080
# =============================================
# Gateway Secret
# Must match gateway.secret in gateway and auth-service
# =============================================
gateway.secret=chatapp-gateway-secret

# =============================================
# Phone validation default region
# =============================================
app.phone.default-region=${PHONE_DEFAULT_REGION:IN}

# =============================================
# Multipart
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =============================================
# Logging
# =============================================
logging.level.com.userservice=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/user-service.log