# =============================================
# Server
# =============================================
server.port=8083
spring.application.name=auth-service
# =============================================
# PostgreSQL Database
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#==============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=auth-service
eureka.instance.prefer-ip-address=false
spring.application.name=auth-service
#==============================================
# =============================================
# Redis
# =============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# =============================================
# SMTP / Email
# =============================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:kakarlapudichetanvarma@gmail.com}
spring.mail.password=${SMTP_PASSWORD:wqxctxdlmyysqmed}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================
# OTP
# =============================================
app.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}

# =============================================
# Application
# =============================================
app.email.from=${EMAIL_FROM:noreply@authservice.com}
app.base-url=${BASE_URL:http://localhost:8080}

# =============================================
# Multipart (profile picture upload)
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Gateway Secret
# Must match gateway.secret in gateway and user-service
# =============================================
gateway.secret=chatapp-gateway-secret

# =============================================
# Logging
# =============================================
logging.level.com.authservice=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/auth-service.log