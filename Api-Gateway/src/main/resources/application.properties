# =============================================
# Server
# =============================================
server.port=8080

# =============================================
# Service URLs
# =============================================
auth.service.url=http://localhost:8083
user.service.url=http://localhost:8082
chat.service.url=http://localhost:8084
notification.service.url=http://localhost:8085

# =============================================
# JWT
# MUST match auth-service jwt secret exactly.
# Auth-service uses BASE64 decoded hex key, so
# we use the same raw hex secret here and decode
# it the same way in JwtUtil.
# =============================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# =============================================
# Redis for Rate Limiting
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =============================================
# Eureka
# =============================================
spring.application.name=api-gateway
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=30

# =============================================
# Logging
# =============================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.chatapp.gateway=DEBUG

# =============================================
# Gateway Secret
# Must match gateway.secret in all downstream services
# =============================================
gateway.secret=chatapp-gateway-secret