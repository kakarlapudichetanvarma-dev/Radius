version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8083
      - USER_SERVICE_URL=http://user-service:8082
    depends_on:
      - redis
      - auth-service
      - user-service
    networks:
      - microservices-net

  auth-service:
    image: auth-service:latest  # Assume built separately
    container_name: auth-service
    ports:
      - "8083:8083"
    networks:
      - microservices-net

  user-service:
    image: user-service:latest
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  # Add chat-service and notification-service similarly

networks:
  microservices-net:
    driver: bridge