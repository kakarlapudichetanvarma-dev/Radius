# ══════════════════════════════════════════════════════════════════════
# discovery-service – Eureka Service Registry Configuration
# Spring Boot 3.3.x | Spring Cloud 2023.x | Java 21
# ══════════════════════════════════════════════════════════════════════

# ─── Server ────────────────────────────────────────────────────────────
server.port=8761

# ─── Application identity ──────────────────────────────────────────────
spring.application.name=discovery-service

# ─── Eureka Server Configuration ───────────────────────────────────────

# Eureka instance
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Eureka client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Eureka server
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.renewal-percent-threshold=0.85

# ─── Spring Boot Actuator ──────────────────────────────────────────────

# Exposed actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoints.web.base-path=/actuator

# Health endpoint
management.endpoint.health.show-details=always

# Info endpoint
management.info.env.enabled=true

# ─── Application Info ──────────────────────────────────────────────────
info.app.name=${spring.application.name}
info.app.description=Eureka Discovery Server for Chat-App microservices
info.app.version=1.0.0
info.app.java-version=21
info.app.spring-boot-version=3.3.0
info.app.spring-cloud-version=2023.0.2

# ─── Logging ───────────────────────────────────────────────────────────

# Root logging level
logging.level.root=INFO

# Eureka logging
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN

# Application package logging
logging.level.com.chatapp=DEBUG

# Console log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%cyan(${spring.application.name})] [%thread] %logger{36} : %msg%n

# File log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} : %msg%n

# Log file
logging.file.name=logs/discovery-service.log