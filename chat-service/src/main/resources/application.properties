# =============================================
# Server
# =============================================
server.port=8084

# =============================================
# Application
# =============================================
spring.application.name=chat-service

# =============================================
# Eureka
# =============================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# =============================================
# PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Redis
# =============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# =============================================
# Kafka
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=chat-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=3

# =============================================
# Kafka Topics
# =============================================
kafka.topic.message-sent=chat.message.sent
kafka.topic.message-delivered=chat.message.delivered
kafka.topic.message-read=chat.message.read
kafka.topic.chat-archived=chat.archived
kafka.topic.group-event=chat.group.event

# =============================================
# JWT (same secret as auth-service)
# =============================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================
# Auth-service URL (via gateway)
# =============================================
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}

# =============================================
# Gateway Secret
# =============================================
gateway.secret=${GATEWAY_SECRET:chatapp-gateway-secret}

# =============================================
# WebClient Codec
# =============================================
spring.codec.max-in-memory-size=10MB

# =============================================
# Redis Cache — recent messages per chat
# =============================================
app.cache.recent-messages-limit=50
app.cache.message-ttl-seconds=3600

# =============================================
# Multipart (file sharing)
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =============================================
# Logging
# =============================================
logging.level.com.chatservice=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/chat-service.log

# =============================================
# WebRTC - STUN/TURN server config
# These are sent to frontend clients via REST
# so they know which ICE servers to use
# =============================================
webrtc.stun.url=stun:stun.l.google.com:19302
webrtc.turn.url=${TURN_URL:}
webrtc.turn.username=${TURN_USERNAME:}
webrtc.turn.credential=${TURN_CREDENTIAL:}
